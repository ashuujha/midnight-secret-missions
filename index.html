    <meta name="theme-color" content="#201b2c" />
    <script>
      try {
        const theme = localStorage.getItem("cat-bluff-theme");
        if (theme === "light") document.documentElement.dataset.theme = "light";
      } catch {
        /* The default clubhouse stays dark when storage is unavailable. */
      }
    </script>
